<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>16-bit EXE Runner</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#07090d;
color:#f4f7fb;
font-family:Inter,Segoe UI,Arial,sans-serif;
overflow:hidden
}

body{
display:flex;
flex-direction:column
}

.top{
height:64px;
display:flex;
align-items:center;
gap:9px;
padding:10px 14px;
background:rgba(20,23,30,.9);
border-bottom:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
z-index:10
}

.title{
font-size:19px;
font-weight:700;
margin-right:auto;
white-space:nowrap
}

button,.fileLabel{
border:1px solid rgba(255,255,255,.12);
background:rgba(255,255,255,.07);
color:#fff;
border-radius:10px;
padding:9px 13px;
font-size:13px;
cursor:pointer;
transition:.15s;
user-select:none
}

button:hover,.fileLabel:hover{
background:rgba(255,255,255,.13);
transform:translateY(-1px)
}

button:active,.fileLabel:active{
transform:translateY(0)
}

button:disabled{
opacity:.4;
cursor:not-allowed;
transform:none
}

.fileLabel{
display:inline-flex;
align-items:center;
gap:7px
}

#fileInput{
display:none
}

.main{
flex:1;
min-height:0;
display:flex
}

.stage{
position:relative;
flex:1;
min-width:0;
background:#000;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

#dos{
position:absolute;
inset:0;
width:100%;
height:100%;
background:#000
}

#dos canvas{
image-rendering:auto
}

.placeholder{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
gap:10px;
color:#818895;
pointer-events:none;
background:radial-gradient(circle at center,rgba(35,42,55,.18),transparent 60%)
}

.placeholder .big{
font-size:48px;
opacity:.7
}

.placeholder strong{
font-size:18px;
color:#d9dde5
}

.placeholder span{
font-size:13px
}

.loader{
position:absolute;
inset:0;
background:rgba(3,5,8,.9);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:15px;
z-index:20;
backdrop-filter:blur(12px)
}

.loader.show{
display:flex
}

.spinner{
width:34px;
height:34px;
border-radius:50%;
border:3px solid rgba(255,255,255,.15);
border-top-color:#fff;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.loaderText{
font-size:14px;
color:#cbd1da
}

.side{
width:310px;
min-width:310px;
background:rgba(15,18,24,.97);
border-left:1px solid rgba(255,255,255,.08);
display:flex;
flex-direction:column;
overflow:hidden
}

.section{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.07)
}

.section h3{
margin:0 0 11px;
font-size:12px;
text-transform:uppercase;
letter-spacing:.12em;
color:#8d96a5
}

.meta{
display:grid;
grid-template-columns:92px 1fr;
gap:7px;
font-size:12px
}

.meta b{
color:#8d96a5;
font-weight:500
}

.meta span{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.badge{
display:inline-block;
padding:3px 7px;
border-radius:6px;
background:rgba(255,255,255,.08);
font-size:11px
}

#log{
flex:1;
min-height:0;
overflow:auto;
padding:12px;
font-family:Consolas,Monaco,monospace;
font-size:11px;
line-height:1.55;
white-space:pre-wrap;
word-break:break-word;
color:#b9c1ce
}

.logLine{
margin-bottom:3px
}

.logTime{
color:#596270
}

.logGood{
color:#9ee493
}

.logWarn{
color:#f4c76b
}

.logError{
color:#ff8d8d
}

.bottom{
height:34px;
padding:0 12px;
display:flex;
align-items:center;
gap:15px;
font-size:11px;
color:#737c89;
background:#0b0e13;
border-top:1px solid rgba(255,255,255,.06)
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:#777
}

.dot.good{
background:#55d66b
}

.dot.warn{
background:#e6b84c
}

.dot.bad{
background:#ed6262
}

@media(max-width:800px){
.side{
width:250px;
min-width:250px
}

.title{
font-size:15px
}

.top button,.fileLabel{
padding:8px 9px
}
}
</style>
</head>

<body>

<div class="top">

<div class="title">16-bit EXE Runner</div>

<label class="fileLabel">
📂 Open Program
<input id="fileInput" type="file" multiple>
</label>

<button id="restartBtn" disabled>↻ Restart</button>
<button id="pauseBtn" disabled>Ⅱ Pause</button>
<button id="fullscreenBtn">⛶ Fullscreen</button>
<button id="copyBtn">Copy Log</button>
<button id="clearBtn">Clear</button>

</div>

<div class="main">

<div class="stage" id="stage">

<div id="dos"></div>

<div class="placeholder" id="placeholder">
<div class="big">▣</div>
<strong>Select a DOS program</strong>
<span>EXE, COM, BAT and companion files are supported</span>
</div>

<div class="loader" id="loader">
<div class="spinner"></div>
<div class="loaderText" id="loaderText">Starting DOSBox…</div>
</div>

</div>

<div class="side">

<div class="section">

<h3>Program</h3>

<div class="meta">

<b>Name</b>
<span id="metaName">—</span>

<b>Size</b>
<span id="metaSize">—</span>

<b>Format</b>
<span id="metaFormat">—</span>

<b>Status</b>
<span id="metaStatus">
<span class="badge">Waiting</span>
</span>

</div>

</div>

<div class="section">

<h3>Environment</h3>

<div class="meta">

<b>Emulator</b>
<span>js-dos v8</span>

<b>CPU</b>
<span>386-compatible DOSBox</span>

<b>Memory</b>
<span>16 MB</span>

<b>Filesystem</b>
<span>Virtual C:</span>

</div>

</div>

<div class="section">
<h3>Debug Log</h3>
</div>

<div id="log"></div>

<div class="bottom">
<span class="dot" id="statusDot"></span>
<span id="bottomStatus">Ready</span>
</div>

</div>

</div>

<script>
"use strict";

const dosElement=document.getElementById("dos");
const fileInput=document.getElementById("fileInput");
const placeholder=document.getElementById("placeholder");
const loader=document.getElementById("loader");
const loaderText=document.getElementById("loaderText");
const logElement=document.getElementById("log");

const metaName=document.getElementById("metaName");
const metaSize=document.getElementById("metaSize");
const metaFormat=document.getElementById("metaFormat");
const metaStatus=document.getElementById("metaStatus");

const statusDot=document.getElementById("statusDot");
const bottomStatus=document.getElementById("bottomStatus");

const restartBtn=document.getElementById("restartBtn");
const pauseBtn=document.getElementById("pauseBtn");
const fullscreenBtn=document.getElementById("fullscreenBtn");
const copyBtn=document.getElementById("copyBtn");
const clearBtn=document.getElementById("clearBtn");

let selectedFiles=[];
let mainFile=null;
let dosInstance=null;
let commandInterface=null;
let currentFs=[];
let currentProgramName="";
let running=false;
let paused=false;
let launching=false;

function now(){
return new Date().toLocaleTimeString();
}

function escapeHtml(value){
return String(value).replace(/[&<>"']/g,function(c){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];
});
}

function log(message,type=""){
const line=document.createElement("div");

line.className="logLine "+(
type==="error"?"logError":
type==="warn"?"logWarn":
type==="good"?"logGood":""
);

line.innerHTML=
'<span class="logTime">['+
now()+
']</span> '+
escapeHtml(message);

logElement.appendChild(line);
logElement.scrollTop=logElement.scrollHeight;
}

function setStatus(text,type=""){
bottomStatus.textContent=text;
statusDot.className="dot "+type;
}

function setMetaStatus(text){
metaStatus.innerHTML=
'<span class="badge">'+
escapeHtml(text)+
'</span>';
}

function showLoader(text){
loaderText.textContent=text;
loader.classList.add("show");
}

function hideLoader(){
loader.classList.remove("show");
}

function formatSize(bytes){
if(bytes<1024)return bytes+" B";
if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
return (bytes/(1024*1024)).toFixed(2)+" MB";
}

function sanitizeDosName(name,index){
let clean=name
.replace(/[\/\\:*?"<>|]/g,"_")
.replace(/\s+/g,"_")
.toUpperCase();

let parts=clean.split(".");
let ext="";
let base=clean;

if(parts.length>1){
ext=parts.pop()
.replace(/[^A-Z0-9_$~!#%&'()@^`{}-]/g,"")
.slice(0,3);

base=parts.join(".");
}

base=base
.replace(/[^A-Z0-9_$~!#%&'()@^`{}-]/g,"")
.slice(0,8);

if(!base){
base="FILE"+(index+1);
}

return ext?base+"."+ext:base;
}

function inspectExecutable(bytes,fileName){
if(bytes.length<2){
return{
format:"Unknown",
detail:"File is too small"
};
}

if(bytes[0]!==0x4D||bytes[1]!==0x5A){

const ext=(fileName.split(".").pop()||"").toLowerCase();

if(ext==="com"){
return{
format:"DOS COM",
detail:"Raw DOS COM program"
};
}

if(ext==="bat"||ext==="cmd"){
return{
format:"DOS Batch",
detail:"DOS command script"
};
}

return{
format:"Data / Unknown",
detail:"No MZ executable header"
};
}

let format="DOS MZ EXE";
let detail="16-bit DOS executable";

if(bytes.length>=64){

const e_lfanew=
bytes[0x3C]|
(bytes[0x3D]<<8)|
(bytes[0x3E]<<16)|
(bytes[0x3F]<<24);

if(
e_lfanew>0 &&
e_lfanew+2<=bytes.length
){

const a=bytes[e_lfanew];
const b=bytes[e_lfanew+1];

if(a===0x4E&&b===0x45){
format="NE executable";
detail="New Executable / Windows 16-bit";
}

else if(a===0x50&&b===0x45){
format="PE executable";
detail="Portable Executable / Windows";
}

else if(a===0x4C&&b===0x45){
format="LE executable";
detail="Linear Executable";
}

else if(a===0x4C&&b===0x58){
format="LX executable";
detail="Linear Executable";
}

}

}

return{
format,
detail
};
}

async function readFile(file){
return new Uint8Array(
await file.arrayBuffer()
);
}

function makeFs(files){

return files.map(function(file,index){

return{
path:sanitizeDosName(file.name,index),
contents:file.bytes
};

});

}

function buildConfig(programName){

const ext=
(programName.split(".").pop()||"")
.toUpperCase();

let command=programName;

if(ext==="BAT"||ext==="CMD"){
command="CALL "+programName;
}

return `
[sdl]
fullscreen=false
output=surface
autolock=true

[dosbox]
title=16-bit EXE Runner
memsize=16

[cpu]
core=auto
cputype=auto
cycles=auto

[render]
aspect=true
scaler=normal2x

[autoexec]
@echo off
mount c .
c:
cls
${command}
echo.
echo.
echo Program finished.
`;

}

async function stopDos(){

if(!dosInstance){
return;
}

log("Stopping previous DOSBox instance…");

try{

if(typeof dosInstance.stop==="function"){
await dosInstance.stop();
}

}catch(error){
log(
"Error stopping DOSBox: "+
(error.message||error),
"warn"
);
}

dosInstance=null;
commandInterface=null;
running=false;
paused=false;

pauseBtn.disabled=true;
restartBtn.disabled=true;
pauseBtn.textContent="Ⅱ Pause";
}

function setupCommandInterface(ci){

commandInterface=ci;

if(!ci){
log(
"ci-ready was received without a CommandInterface.",
"error"
);

return;
}

running=true;
paused=false;
launching=false;

restartBtn.disabled=false;
pauseBtn.disabled=false;

setStatus("Running","good");
setMetaStatus("Running");
hideLoader();

log(
"Command interface ready.",
"good"
);

log(
"DOSBox is now executing the autoexec command."
);

try{

if(typeof ci.events==="function"){

const events=ci.events();

if(events&&typeof events.onError==="function"){

events.onError(function(error){

log(
"DOSBox error: "+
(error&&error.message?
error.message:
error),
"error"
);

});

}

}

}catch(error){

log(
"Event hook warning: "+
(error.message||error),
"warn"
);

}

}

async function launch(){

if(!mainFile){
log(
"No program selected.",
"warn"
);
return;
}

if(typeof Dos!=="function"){

log(
"js-dos library is not available.",
"error"
);

setStatus(
"js-dos unavailable",
"bad"
);

return;
}

if(launching){
return;
}

launching=true;

await stopDos();

dosElement.innerHTML="";

placeholder.style.display="none";

showLoader("Preparing DOSBox…");

setStatus(
"Preparing…",
"warn"
);

setMetaStatus("Preparing");

currentFs=makeFs(selectedFiles);

log(
"Preparing virtual DOS filesystem…"
);

log(
"Files loaded into virtual C: drive:"
);

for(const item of currentFs){

log(
"  C:\\"+
item.path+
" ("+
formatSize(item.contents.length)+
")"
);

}

const info=inspectExecutable(
mainFile.bytes,
mainFile.name
);

metaName.textContent=mainFile.name;
metaSize.textContent=formatSize(mainFile.bytes.length);
metaFormat.textContent=info.format;

log(
"Executable type: "+
info.format
);

log(
info.detail
);

if(info.format==="NE executable"){

log(
"WARNING: this is a Windows NE executable.",
"warn"
);

log(
"DOSBox can only run it if a compatible Windows environment is installed.",
"warn"
);

}

currentProgramName=
sanitizeDosName(
mainFile.name,
0
);

const config=
buildConfig(
currentProgramName
);

log(
"DOSBox configuration created."
);

log(
"Program command: "+
currentProgramName
);

log(
"Calling js-dos Dos()…"
);

try{

dosInstance=Dos(
dosElement,
{

dosboxConf:config,

initFs:currentFs,

autoStart:true,

kiosk:true,

thinSidebar:true,

noCursor:true,

pathPrefix:
"https://v8.js-dos.com/latest/emulators/",

onEvent:function(event,arg){

log(
"js-dos event: "+
event
);

if(event==="emu-ready"){

log(
"Emulator backend loaded.",
"good"
);

showLoader(
"Starting DOSBox…"
);

}

else if(event==="bnd-play"){

log(
"DOSBox play event received."
);

}

else if(event==="ci-ready"){

setupCommandInterface(arg);

}

else if(event==="fullscreen-change"){

log(
"Fullscreen: "+
(arg?"on":"off")
);

}

}

});

log(
"Dos() returned successfully.",
"good"
);

log(
"Waiting for ci-ready…"
);

}catch(error){

launching=false;

hideLoader();

log(
"START FAILED: "+
(error&&error.message?
error.message:
error),
"error"
);

setStatus(
"Failed",
"bad"
);

setMetaStatus("Error");

console.error(error);

return;
}

}

async function restart(){

if(!mainFile){
return;
}

log(
"Restart requested."
);

await launch();

}

function togglePause(){

if(!dosInstance){
return;
}

try{

paused=!paused;

if(typeof dosInstance.setPaused==="function"){

dosInstance.setPaused(
paused
);

}

else if(commandInterface){

if(paused&&typeof commandInterface.pause==="function"){
commandInterface.pause();
}

if(!paused&&typeof commandInterface.resume==="function"){
commandInterface.resume();
}

}

if(paused){

pauseBtn.textContent="▶ Resume";

setStatus(
"Paused",
"warn"
);

setMetaStatus("Paused");

log(
"Emulation paused.",
"warn"
);

}else{

pauseBtn.textContent="Ⅱ Pause";

setStatus(
"Running",
"good"
);

setMetaStatus("Running");

log(
"Emulation resumed.",
"good"
);

}

}catch(error){

log(
"Pause/resume error: "+
(error.message||error),
"error"
);

}

}

async function fullscreen(){

try{

if(document.fullscreenElement){

await document.exitFullscreen();

return;

}

await document
.getElementById("stage")
.requestFullscreen();

}catch(error){

log(
"Fullscreen error: "+
(error.message||error),
"error"
);

}

}

fileInput.addEventListener(
"change",
async function(){

const files=
Array.from(
fileInput.files||[]
);

if(!files.length){
return;
}

showLoader(
"Reading program files…"
);

try{

selectedFiles=[];

for(const file of files){

const bytes=
await readFile(file);

selectedFiles.push({

name:file.name,

size:file.size,

type:file.type,

bytes

});

}

mainFile=
selectedFiles.find(function(file){

const ext=
(file.name.split(".").pop()||"")
.toLowerCase();

return[
"exe",
"com",
"bat",
"cmd"
].includes(ext);

})||
selectedFiles[0];

if(!mainFile){

throw new Error(
"No executable or batch file found."
);

}

const info=
inspectExecutable(
mainFile.bytes,
mainFile.name
);

metaName.textContent=
mainFile.name;

metaSize.textContent=
formatSize(mainFile.bytes.length);

metaFormat.textContent=
info.format;

setMetaStatus("Loaded");

placeholder.style.display="none";

log(
"Selected "+
selectedFiles.length+
" file(s).",
"good"
);

for(const file of selectedFiles){

log(
"  "+
file.name+
" — "+
formatSize(file.size)
);

}

log(
"Main program: "+
mainFile.name
);

log(
"Format: "+
info.format
);

setStatus(
"Ready to launch",
"good"
);

restartBtn.disabled=false;

await launch();

}catch(error){

hideLoader();

log(
"File loading failed: "+
(error.message||error),
"error"
);

setStatus(
"Load failed",
"bad"
);

setMetaStatus("Error");

}

});

restartBtn.addEventListener(
"click",
restart
);

pauseBtn.addEventListener(
"click",
togglePause
);

fullscreenBtn.addEventListener(
"click",
fullscreen
);

copyBtn.addEventListener(
"click",
async function(){

const text=
Array.from(
logElement.children
)
.map(function(x){
return x.textContent;
})
.join("\n");

try{

await navigator.clipboard.writeText(
text
);

log(
"Log copied to clipboard.",
"good"
);

}catch(error){

log(
"Could not copy log: "+
(error.message||error),
"error"
);

}

});

clearBtn.addEventListener(
"click",
function(){
logElement.innerHTML="";
});

document.addEventListener(
"fullscreenchange",
function(){

fullscreenBtn.textContent=
document.fullscreenElement?
"⛶ Exit Fullscreen":
"⛶ Fullscreen";

});

window.addEventListener(
"beforeunload",
function(){

if(dosInstance&&
typeof dosInstance.stop==="function"){

dosInstance.stop();

}

});

log(
"16-bit EXE Runner initialized.",
"good"
);

log(
"js-dos v8 loader detected: "+
(typeof Dos==="function"?"yes":"no")
);

if(location.protocol==="file:"){

log(
"WARNING: page is running from file://",
"warn"
);

log(
"js-dos officially requires HTTP/HTTPS hosting.",
"warn"
);

}

setStatus("Ready");
</script>

</body>
</html>
